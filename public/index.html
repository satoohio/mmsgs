<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>mmsgs — мессенджер</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236c8cff'/%3E%3Cpath d='M8 11h16M8 16h11M8 21h14' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- ============================ ЭКРАН ВХОДА ============================ -->
  <section id="auth-screen" class="auth hidden" aria-label="Вход в mmsgs">
    <div class="auth__card">
      <div class="auth__brand">
        <span class="auth__logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="34" height="34"><rect width="32" height="32" rx="9" fill="#6c8cff"/><path d="M8 11h16M8 16h11M8 21h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
        </span>
        <div>
          <h1>mmsgs</h1>
          <p class="auth__tagline">Личные и групповые чаты в реальном времени</p>
        </div>
      </div>

      <div class="auth__tabs" role="tablist">
        <button class="auth__tab is-active" data-tab="login" role="tab" aria-selected="true">Вход</button>
        <button class="auth__tab" data-tab="register" role="tab" aria-selected="false">Регистрация</button>
      </div>

      <form id="auth-form" class="auth__form" novalidate>
        <label class="field" data-only="register">
          <span class="field__label">Имя</span>
          <input class="field__input" name="displayName" type="text" autocomplete="name" placeholder="Как вас называть" maxlength="48" />
        </label>

        <label class="field">
          <span class="field__label">Логин</span>
          <input class="field__input" name="username" type="text" autocomplete="username" placeholder="например, anna" maxlength="24" required />
        </label>

        <label class="field">
          <span class="field__label">Пароль</span>
          <input class="field__input" name="password" type="password" autocomplete="current-password" placeholder="минимум 6 символов" required />
        </label>

        <div id="auth-error" class="auth__error" role="alert" hidden></div>
        <button class="btn btn--primary btn--block" type="submit" id="auth-submit">Войти</button>
      </form>

      <div class="auth__demo">
        <p>Демо-доступы — нажмите, чтобы подставить:</p>
        <div class="auth__demo-row">
          <button class="chip" data-demo="demo:demo1234">demo / demo1234</button>
          <button class="chip" data-demo="anna:anna1234">anna / anna1234</button>
          <button class="chip" data-demo="maxim:max1234">maxim / max1234</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================= ПРИЛОЖЕНИЕ ============================= -->
  <div id="app" class="app hidden">
    <!-- ------------------------------ Сайдбар ------------------------------ -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar__top">
        <button class="avatar avatar--me" id="me-avatar" title="Профиль"></button>
        <div class="sidebar__identity">
          <div class="sidebar__name" id="me-name"></div>
          <div class="sidebar__nick" id="me-nick"></div>
        </div>
        <div class="sidebar__tools">
          <button class="icon-btn" id="btn-new-group" title="Новая группа" aria-label="Новая группа">
            <svg viewBox="0 0 24 24"><path d="M17 20h5v-2a4 4 0 0 0-3-3.87M9 20H4v-2a4 4 0 0 1 3-3.87m6-1.13a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm6-4a3 3 0 1 0-2.2-2.9M6.2 9.1A3 3 0 0 0 3 12"/></svg>
          </button>
          <button class="icon-btn" id="btn-settings" title="Настройки" aria-label="Настройки">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
          </button>
          <button class="icon-btn" id="btn-logout" title="Выйти" aria-label="Выйти">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </div>
      </header>

      <div class="sidebar__search">
        <svg class="sidebar__search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="global-search" type="search" placeholder="Поиск людей и сообщений" autocomplete="off" aria-label="Глобальный поиск" />
        <button class="sidebar__search-clear" id="search-clear" hidden aria-label="Очистить">×</button>
      </div>

      <nav class="tabs" role="tablist" aria-label="Разделы">
        <button class="tab is-active" data-pane="chats" role="tab">Чаты</button>
        <button class="tab" data-pane="friends" role="tab">Друзья</button>
        <button class="tab" data-pane="requests" role="tab">
          Заявки<span class="tab__badge" id="requests-badge" hidden>0</span>
        </button>
      </nav>

      <div class="sidebar__list" id="sidebar-list" role="list"></div>

      <footer class="sidebar__status">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-text">подключение…</span>
      </footer>
    </aside>

    <!-- ------------------------------- Чат -------------------------------- -->
    <main class="chat" id="chat">
      <div class="chat__empty" id="chat-empty">
        <svg viewBox="0 0 24 24" width="52" height="52"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-1L3 20l1.2-4.4A8 8 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/></svg>
        <h2>Выберите чат</h2>
        <p>Слева — ваши диалоги и группы. Или найдите человека через поиск и напишите первым.</p>
      </div>

      <header class="chat__header" id="chat-header" hidden>
        <button class="icon-btn chat__back" id="btn-back" aria-label="Назад к списку">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="avatar" id="chat-avatar" aria-label="Аватар чата"></button>
        <div class="chat__heading">
          <div class="chat__title" id="chat-title"></div>
          <div class="chat__subtitle" id="chat-subtitle"></div>
        </div>
        <div class="chat__tools">
          <button class="icon-btn" id="btn-search-in-chat" title="Поиск в чате" aria-label="Поиск в чате">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <button class="icon-btn" id="btn-info" title="Информация о чате" aria-label="Информация о чате">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
          </button>
        </div>
      </header>

      <div class="chat__searchbar" id="chat-searchbar" hidden>
        <input id="chat-search-input" type="search" placeholder="Поиск по этому чату" autocomplete="off" />
        <button class="btn btn--ghost btn--sm" id="chat-search-close">Закрыть</button>
      </div>

      <div class="messages" id="messages" tabindex="0" aria-live="polite"></div>

      <div class="chat__typing" id="typing-indicator" hidden></div>

      <footer class="composer" id="composer" hidden>
        <div class="composer__reply" id="reply-preview" hidden>
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v1"/></svg>
          <div class="composer__reply-body">
            <span class="composer__reply-name" id="reply-name"></span>
            <span class="composer__reply-text" id="reply-text"></span>
          </div>
          <button class="icon-btn icon-btn--sm" id="reply-cancel" aria-label="Отменить ответ">×</button>
        </div>

        <div class="composer__attach" id="attach-preview" hidden></div>

        <div class="composer__row">
          <button class="icon-btn" id="btn-attach" title="Прикрепить файл" aria-label="Прикрепить файл">
            <svg viewBox="0 0 24 24"><path d="m21 11-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8L13.2 3.2a3.7 3.7 0 0 1 5.2 5.2L9.8 17a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
          </button>
          <input type="file" id="file-input" hidden multiple />
          <textarea id="composer-input" class="composer__input" rows="1" placeholder="Сообщение…" aria-label="Текст сообщения"></textarea>
          <button class="icon-btn" id="btn-emoji" title="Эмодзи" aria-label="Эмодзи">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>
          </button>
          <button class="send-btn" id="btn-send" title="Отправить (Enter)" aria-label="Отправить" disabled>
            <svg viewBox="0 0 24 24"><path d="M4.5 12 20 4.5 15 20l-3.6-6.2L4.5 12Z"/></svg>
          </button>
        </div>
        <div class="emoji-picker" id="emoji-picker" hidden></div>
      </footer>
    </main>

    <!-- --------------------------- Панель инфо ---------------------------- -->
    <aside class="info" id="info-panel" hidden aria-label="Информация о чате"></aside>
  </div>

  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
